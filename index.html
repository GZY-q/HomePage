<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>主页 · GlassBlog</title>
  <meta name="description" content="GlassBlog 个人主页：博客文章与自研软件发布。" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="GlassBlog 个人主页" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- 提前恢复主题，避免暗色模式白闪（FOUC）；与 common.js initTheme 逻辑保持一致 -->
  <script>try{if(localStorage.getItem("gb_theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
  <script src="assets/js/tailwind.min.js"></script>
  <link rel="stylesheet" href="assets/css/glass.css?v=20261013c" />
  <link rel="alternate" type="application/rss+xml" title="GlassBlog RSS" href="rss.xml" />
</head>
<body class="min-h-screen antialiased">
  <nav id="nav"></nav>

  <main class="max-w-3xl mx-auto px-5 pt-32 pb-20 space-y-8">
    <!-- 个人卡片 -->
    <section class="glass fade-in p-10 flex flex-col items-center text-center">
      <img id="avatar" alt="头像"
        class="w-24 h-24 rounded-full object-cover ring-1 ring-[var(--glass-border)] shadow-lg" />
      <h1 id="profileName" class="mt-5 text-3xl font-semibold tracking-tight"></h1>
      <p id="bio" class="mt-3 text-secondary leading-relaxed max-w-md"></p>
      <div id="socials" class="mt-6 flex flex-wrap justify-center gap-3"></div>
    </section>

    <!-- 最新文章 -->
    <section class="fade-in" style="animation-delay:.1s">
      <div class="flex items-baseline justify-between mb-4 px-1">
        <h2 class="text-lg font-semibold">最新文章</h2>
        <a href="blog.html" class="text-sm text-accent">全部 →</a>
      </div>
      <div id="latestPosts" class="space-y-3"></div>
    </section>

    <!-- 软件作品 -->
    <section class="fade-in" style="animation-delay:.2s">
      <div class="flex items-baseline justify-between mb-4 px-1">
        <h2 class="text-lg font-semibold">软件作品</h2>
        <a href="apps.html" class="text-sm text-accent">全部 →</a>
      </div>
      <div id="latestApps" class="grid sm:grid-cols-2 gap-4"></div>
    </section>

    <footer class="text-center text-sm text-secondary pt-8">
      © 2026 GlassBlog · 极简液态玻璃
    </footer>
  </main>

  <script src="assets/js/schema.js?v=20261013"></script>
  <script src="assets/js/common.js?v=20261013c"></script>
  <script>
    GB.renderNav("home");
    (async () => {
      const data = await GB.load();
      GB.track(); // 隐私友好访问上报（仅后端模式生效）

      // 个人资料
      avatar.src = data.profile.avatar;
      profileName.textContent = data.profile.name; // 注意：id 不能叫 "name"（window.name 内置属性会屏蔽命名访问）
      bio.textContent = data.profile.bio;
      socials.innerHTML = (data.profile.socials || []).map((s) =>
        `<a href="${GB.esc(s.url)}" target="_blank" rel="noopener"
           class="glass-sm px-4 py-1.5 text-sm text-secondary hover:text-accent">${GB.esc(s.name)}</a>`
      ).join("");

      // 最新 3 篇已发布文章（按创建时刻排序）
      const posts = data.posts
        .filter((p) => p.status === "published")
        .sort((a, b) => new Date(b.createdAt || b.date) - new Date(a.createdAt || a.date))
        .slice(0, 3);
      latestPosts.innerHTML = posts.length ? posts.map((p) =>
        `<a href="blog.html#${p.slug || p.id}" class="glass glass-hover block p-5">
           <div class="flex items-baseline justify-between gap-4">
             <h3 class="font-medium">${GB.esc(p.title)}</h3>
             <time class="text-xs text-secondary shrink-0">${GB.fmtDate(p.date)}</time>
           </div>
           <p class="mt-1.5 text-sm text-secondary line-clamp-2">${GB.esc(p.excerpt)}</p>
         </a>`
      ).join("") : `<div class="glass p-8 text-center text-sm text-secondary">还没有发布文章</div>`;

      // 最新 2 个软件
      latestApps.innerHTML = data.projects.length ? data.projects.slice(0, 2).map((p) =>
        `<a href="apps.html#${p.id}" class="glass glass-hover p-5 block">
           <div class="flex items-center justify-between">
             <h3 class="font-medium">${GB.esc(p.name)}</h3>
             <span class="glass-sm px-2.5 py-0.5 text-xs text-accent">v${GB.esc(p.version)}</span>
           </div>
           <p class="mt-1.5 text-sm text-secondary line-clamp-2">${GB.esc(p.desc)}</p>
         </a>`
      ).join("") : `<div class="glass p-8 text-center text-sm text-secondary">还没有发布软件</div>`;

      GB.emit("home:render", data); // 模块挂钩点
    })();
  </script>
</body>
</html>
