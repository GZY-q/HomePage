# GlassBlog Nginx 站点配置（备选方案，HTTPS 用 certbot 自动签发）
# 1. sudo cp deploy/nginx.conf /etc/nginx/sites-available/glassblog
# 2. sudo ln -s /etc/nginx/sites-available/glassblog /etc/nginx/sites-enabled/
# 3. 把 blog.example.com 改成你的域名
# 4. sudo nginx -t && sudo systemctl reload nginx
# 5. 一键签发证书：sudo apt install certbot python3-certbot-nginx
#    sudo certbot --nginx -d blog.example.com
#    （certbot 会自动把本配置升级为 443 SSL + HTTP 跳转）

server {
    listen 80;
    server_name blog.example.com;

    # 上传体积上限（安装包最大 500MB，与服务端一致）
    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件上传超时放宽
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 安全响应头（与 server.js SEC_HEADERS 对齐；先隐藏上游同名头再补，避免重复）
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # HTML 页面（含 memos.html / admin.html）不缓存，保证发布与改动即时可见
    location ~ \.html$ {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
